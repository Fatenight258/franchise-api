server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: franchise-api
  config:
    import: optional:file:.env[.properties]
  webflux:
    base-path: /api/v1
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:franchise}?serverZoneId=UTC
    username: ${DB_USER:franchise}
    password: ${DB_PASSWORD:franchise}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi/franchise-api.yaml

logging:
  level:
    root: ${LOG_LEVEL:INFO}